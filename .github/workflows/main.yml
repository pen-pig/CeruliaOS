# ============================================================
# EZOS GitHub Actions workflow
#   - push 到 main / dev         : 构建 + QEMU 冒烟测试 + 可下载的测试包
#   - PR 到 main                 : 构建 + QEMU 冒烟测试 + 可下载的测试包
#   - 打 tag v*                  : 构建 + 冒烟 + 打包发布到 GitHub Release
#
# 工具链：Ubuntu apt 轻量方案（nasm + gcc-multilib + qemu-system-x86），
# 不下载 800MB 的第三方 i686-elf 包；64 位除法由 dev 分支自带的
# kernel/div64.c 提供 __udivdi3/__umoddi3，无 libgcc 也能链接通过。
# 构建细节统一收敛在 ci/build.sh（padding 从 boot.asm 自动推导）。
# ============================================================
name: build-and-release

on:
  workflow_dispatch:        # 手动触发：Actions 页点 Run workflow，可指定分支
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Source checkout guard
        shell: bash
        run: python3 tools/check_build_inputs.py --tracked --release 2>&1 | tee ci-inputs.log

      - name: Check build preflight
        run: python3 tests/test_build_inputs.py

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm gcc-multilib qemu-system-x86 python3
          gcc --version | head -1
          nasm -v
          qemu-system-x86_64 --version | head -1

      # rust_bridge.h 里 EZ_EXFAT_IMPL 默认 1 = Rust，exFAT 校验和的**生产
      # 路径**就走 *_rs；`rstest` 还要 *_zig 做三路对拍。这两个产物缺了就是
      # 链接期 undefined reference（CI 因此连红了十几次），所以必须真装真编。
      #
      # Use the exact release from the project config (no moving stable/nightly).
      - name: Install rust-src (needed by -Z build-std)
        working-directory: rust/ezos_rs
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src
          rustc --version
          cargo --version

      - name: Install Zig 0.15.1
        run: |
          curl -fsSL --retry 3 -o zig.tar.xz \
            https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
          echo "c61c5da6edeea14ca51ecd5e4520c6f4189ef5250383db33d01848293bfafe05  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          # $GITHUB_PATH 的改动**在同一步里不生效**（要下一步才生效），所以
          # 这里必须用绝对路径自检；同时写 GITHUB_ENV 让 build.sh 明确拿到
          # 它（PATH 那行是给后续步骤和人肉调试用的）。
          echo "$PWD/zig-x86_64-linux-0.15.1" >> "$GITHUB_PATH"
          echo "ZIG=$PWD/zig-x86_64-linux-0.15.1/zig" >> "$GITHUB_ENV"
          "$PWD/zig-x86_64-linux-0.15.1/zig" version

      - name: Build kernel image
        shell: bash
        run: bash ci/build.sh 2>&1 | tee ci-build.log

      # 在启动 QEMU 前验证 BIOS 镜像布局和扇区计数。
      - name: Image layout guard
        run: python3 tests/test_image.py

      # 栈预算：内核主栈只有 ~21KB、任务栈 16KB，而且越界**不崩**——只是静默
      # 写穿紧邻的 .data（历史上 shell 的 cmd_ls 把 fs.c 的 ro_cwd 覆盖成
      # 文件名，症状伪装成文件系统损坏）。这一关守的就是"栈上放大数组"。
      # CI 没有交叉编译器，用 gcc-multilib 的 gcc 顶上：脚本里已显式 -m32，
      # 且 CFLAGS 与 build.ninja 一致（-Os），量到的才是真构建的那份栈用量。
      - name: Stack budget guard
        env:
          EZOS_CC: gcc
        run: python3 tools/check_stack.py

      # 指令集闸门：Rust / Zig 产物里不许出现 SSE/SSE2。内核只做 fninit
      # （x87），从不设 CR4.OSFXSR、也不保存 XMM 上下文——那些指令必然
      # #UD。实测踩过：Zig 的 levenshtein_zig 里一个数组清零被编成
      # movdqa，rstest 一跑就 panic（vector 06）。Zig 默认 baseline 档
      # 允许 SSE，必须显式 -mcpu i686。
      - name: CPU feature guard (no SSE in Rust/Zig/QuickJS objects)
        run: python3 tools/check_cpu.py --require-all

      # VMware 配置闸门：vmx 缺 virtualHW.version / config.version 时，
      # VMware 26 的表现是 "Could not open virtual machine ... Internal error.
      # Remove from library?"——报错完全不提字段名，只会让人去怀疑虚拟机库。
      # 模板在 tools/make_vmware.py，改它的时候这道会红。
      - name: VMware vmx guard (required fields present)
        run: python3 tools/check_vmx.py

      - name: Generate data disk
        run: python3 tools/gen_diskimg.py disk.img

      # 宿主机侧只读体检：Boot Checksum（主/备）、备份 VBR、位图↔FAT 一致性、
      # Up-case 校验和、根目录次级条目标志位、MBR。这几个地方写错的话，内核
      # 读自己写的盘照样绿、Windows 却直接弹"需要格式化"——只有独立实现能抓。
      - name: Disk image health probe
        run: python3 tools/host_probe.py disk.img

      # 不再只判断「QEMU 12 秒没崩」——那是个弱断言：内核卡在 shell 之前、
      # 25 个子系统自检全红、文件系统没挂上，它照样绿。现在 ci/smoke.sh 把
      # 串口输出落成文件并对内容下断言（内核横幅 / INT13h 读入 / 全部自检
      # PASS / shell 提示符 / 两块盘 / FS 就绪 + 反向断言不许出现 FAIL/panic）。
      - name: Smoke test in QEMU
        run: bash ci/smoke.sh

      - name: Show image sizes
        run: ls -l os-image.bin disk.img

      # 普通构建也试打包，否则 Release 问题只能等打 tag 才能发现。
      - name: Assemble release asset
        shell: bash
        run: |
          tag="v0.0.0-ci-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          python3 ci/package_release.py "$tag" 2>&1 | tee ci-package.log
          sha256sum -c "EZOS-$tag.zip.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            EZOS-*.zip
            EZOS-*.zip.sha256
          if-no-files-found: error

      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            ci-*.log
            serial.log
          if-no-files-found: ignore

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified build archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive
      - name: Verify downloaded archive
        run: sha256sum -c EZOS-*.zip.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EZOS-*.zip
            EZOS-*.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
